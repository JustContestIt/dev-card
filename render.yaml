# Render Blueprint — deploys the card from the Dockerfile.
# Database: create a free CockroachDB Cloud cluster and paste its
# connection string into DATABASE_URL (see DEPLOY.md).
services:
  - type: web
    name: dev-card
    runtime: docker
    plan: free
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set in the Render dashboard
      - key: PUBLIC_URL
        sync: false # e.g. https://dev-card.onrender.com
      - key: IP_HASH_SALT
        generateValue: true
      - key: CORS_ORIGINS
        value: '*'
      - key: LOG_LEVEL
        value: info
